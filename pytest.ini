[pytest]
; Every suite in the tree, not just the root one. The vision and remote-control
; subsystems keep their tests beside their code; listing only `tests` meant
; those ran nowhere and passed by never executing.
testpaths = tests comp_vision_sim remote_control/tests
addopts = -ra --strict-markers
markers =
    integration: uses the compiled MuJoCo robot model
    rendering: creates an off-screen OpenGL renderer
    slow: exercises an expensive build or model operation
